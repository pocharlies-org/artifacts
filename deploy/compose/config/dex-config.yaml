# Dex for the local dev stack: three static users (the second and third exist so plugins
# can test sharing between people and a refusal for someone outside the ACL), each with a
# distinct display name (Dex puts `username` in the id_token `name` claim), password
# grant enabled so the e2e can obtain an id_token without a browser. The passwords are
# fixed dev placeholders.
# One issuer URL for everyone: the host (browser, e2e.sh) reaches Dex on the published
# 127.0.0.1:5556, and oauth2-proxy shares the Dex container's network namespace
# (docker-compose.yml), so 127.0.0.1:5556 is Dex for it too. Literal on purpose: Dex
# does not expand environment variables in `issuer`.
issuer: http://127.0.0.1:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  # the resource-owner password grant (e2e.sh, no browser) logs in via the local DB
  passwordConnector: local
enablePasswordDB: true
staticPasswords:
  - email: "test@example.com"
    # bcrypt of "test-password" (dev only)
    hash: "$2a$10$jBIY5t1en/2umGuVZX/EZOFaR17ROfctS1iFlRQM0osvj7Et/vrNS"
    username: "Test One"
    userID: "11111111-2222-4333-8444-555555555555"
  - email: "test2@example.com"
    # bcrypt of "test2-password" (dev only)
    hash: "$2a$10$QBxGuMEVwvFSrdEZYDu/YO/3gqRihjmnTepaiCb5ReH6gcJ7aMLTy"
    username: "Test Two"
    userID: "22222222-3333-4444-8555-666666666666"
  - email: "test3@example.com"
    # bcrypt of "test3-password" (dev only)
    hash: "$2a$10$eOKMrF/MQViLptht4wQ0zOqENduSBbGFb0E9uLFklpb6A/bN9Un26"
    username: "Test Three"
    userID: "33333333-4444-4555-8666-777777777777"
staticClients:
  - id: artifacts-dev
    secret: artifacts-dev-secret-not-a-real-secret
    name: artifacts dev
    redirectURIs:
      - "http://127.0.0.1:8080/oauth2/callback"
