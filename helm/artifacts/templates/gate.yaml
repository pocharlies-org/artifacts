{{- /* artifact-gate. Single-file stdlib service (gate/gate.py), run as /app/gate.py in one of two
       modes (values.yaml "gate"):
         gate.bakedImage=false (default): gate.image (stock Python) + the code mounted from the
                                ConfigMap <sso>/artifact-gate-code, recreated from git on every deploy.
         gate.bakedImage=true:  the gate image (gate/Dockerfile) with the code inside, referenced as
                                <gate.bakedImageRepository>@<gate.bakedImageDigest>; no ConfigMap,
                                no code volume, no mount.
       Lives in the sso namespace because traefik must be able to watch its routes there.

       Two listeners, one process: the public surface (request-access: /_gate/request|approve|deny,
       405 on writes) is served on 8080 = the port the public IngressRoute points at; the decision
       endpoints /_gate/auth, /_gate/pub-auth (the anonymous pub/ decision) and /_gate/plugin/authz
       exist ONLY on values.gate.authPort (8081), which no public route references. The gate
       itself 404s them on the public listener, so even a misrouted route cannot drive a decision.

       Secrets (all created outside git, see README):
         <sso>/artifact-gate-s3     access-key/secret-key: least-privilege S3 user (GetObject on
                                    the bucket; PutObject only on the artifact-root .acl.json files,
                                    u/<run>/ and g/<slug>/<run>/, and _gate/ state). ACL/state work only.
         <sso>/artifact-gate-read-s3 access-key/secret-key: read-signing S3 user (GetObject on the
                                    bucket, explicit Deny on _gate/*, _plugins/*, every .acl.json).
                                    Signs ONLY the forwarded artifact reads.
         <sso>/artifact-gate-keys   hmac-key: signs CSRF + approve/deny tokens.
         <sso>/artifact-gate-slack  bot-token: optional; without it the gate logs notifications
                                    instead of sending DMs. */ -}}
{{- $sso := .Values.namespaces.sso }}
{{- $baked := .Values.gate.bakedImage | default false }}
{{- if not (kindIs "bool" $baked) }}
{{- fail (printf "gate.bakedImage must be a boolean (true or false), got %v" $baked) }}
{{- end }}
{{- $gateImage := .Values.gate.image }}
{{- if $baked }}
{{- $repo := .Values.gate.bakedImageRepository | default "" }}
{{- $digest := .Values.gate.bakedImageDigest | default "" }}
{{- /* characters first (fail closed: nothing but a repository reference reaches the
       Deployment, no newline, space or quote), then no tag and no digest */ -}}
{{- if or (not $repo) (not (regexMatch "^[a-z0-9./:_-]+$" $repo)) (contains ":" (base $repo)) }}
{{- fail (printf "gate.bakedImageRepository must be an image repository (lowercase letters, digits and . / : _ -) without a tag or digest, got %q" $repo) }}
{{- end }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}
{{- fail (printf "gate.bakedImageDigest must be sha256:<64 lowercase hex> when gate.bakedImage is true, got %q" $digest) }}
{{- end }}
{{- $gateImage = printf "%s@%s" $repo $digest }}
{{- end }}
{{- /* Request-access caps (values gate.requestCaps): whole numbers from 1 to 999999. A number
       only: a string, a boolean, a fraction or a missing entry is refused, never read as
       "no limit". The gate refuses to start on the same inputs. */ -}}
{{- $caps := .Values.gate.requestCaps | default dict }}
{{- if not (kindIs "map" $caps) }}
{{- fail (printf "gate.requestCaps must be a map (perRequester, ownerPending), got %v" $caps) }}
{{- end }}
{{- range $name := list "perRequester" "ownerPending" }}
{{- $v := index $caps $name }}
{{- if not (and (or (kindIs "float64" $v) (kindIs "int64" $v) (kindIs "int" $v)) (regexMatch "^[1-9][0-9]{0,5}$" (toString $v))) }}
{{- fail (printf "gate.requestCaps.%s must be a whole number from 1 to 999999, got %v" $name $v) }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-gate
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/name: artifact-gate
    app.kubernetes.io/part-of: artifacts
spec:
  replicas: 1
  strategy: {type: Recreate}   # the grant_access serialisation (gate/gate.py _grant_lock) is an
                               # in-process threading lock: two gate pods would race on the same ACL
                               # read-modify-write. Recreate guarantees a rollout never runs two gates.
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-gate
        app.kubernetes.io/part-of: artifacts
    spec:
      automountServiceAccountToken: false   # the gate never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000   # the hmac-key secret is mode 0400: kubelet chowns it to this group so the
                        # gate (uid 1000) can read it without making it world-readable
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: {{ $gateImage }}
          command: ["python3", "/app/gate.py"]
          env:
            - name: MINIO_ENDPOINT
              value: http://{{ .Values.minio.service }}.{{ .Values.minio.namespace }}.svc.cluster.local:{{ .Values.minio.port }}
            - name: GATE_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: OAUTH2_AUTH_URL
              value: http://oauth2-proxy-artifacts.{{ $sso }}.svc.cluster.local:4180/oauth2-artifacts/auth
            - name: PUBLIC_HOST
              value: {{ .Values.artifactsHost }}
            - name: GATE_ANONYMOUS_PUB_ENABLED
              value: {{ .Values.artifactsGate.anonymousPubEnabled | quote }}
            - name: HMAC_KEY_FILE
              value: /secrets/hmac-key
            - name: GATE_AUTH_PORT
              value: {{ .Values.gate.authPort | quote }}
            - name: GATE_REQUESTER_RATE_LIMIT_MAX
              value: {{ $caps.perRequester | toString | quote }}
            - name: GATE_OWNER_PENDING_MAX
              value: {{ $caps.ownerPending | toString | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.gate.s3SecretName }}, key: access-key}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.gate.s3SecretName }}, key: secret-key}
            - name: GATE_READ_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ required "gate.readS3SecretName is required (read-signing S3 user)" .Values.gate.readS3SecretName }}, key: access-key}
            - name: GATE_READ_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.gate.readS3SecretName }}, key: secret-key}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.gate.slackSecretName }}, key: bot-token, optional: true}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}   # public request-access surface
            - {name: auth, containerPort: {{ .Values.gate.authPort }}, protocol: TCP}  # forwardAuth only
          livenessProbe:
            httpGet: {path: /_gate/healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /_gate/healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml (required "gate.resources is required" .Values.gate.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- if not $baked }}
            - {name: code, mountPath: /app, readOnly: true}
            {{- end }}
            - {name: hmac-key, mountPath: /secrets, readOnly: true}
      volumes:
        {{- if not $baked }}
        - name: code
          configMap:
            name: artifact-gate-code
            defaultMode: 0444
        {{- end }}
        - name: hmac-key
          secret:
            secretName: {{ .Values.gate.keysSecretName }}
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-gate
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/name: artifact-gate
    app.kubernetes.io/part-of: artifacts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: artifact-gate
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}   # referenced by the public routes
    - {name: auth, port: {{ .Values.gate.authPort }}, targetPort: auth, protocol: TCP}  # forwardAuth target
