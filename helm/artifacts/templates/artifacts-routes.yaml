{{- /* Routes for the artifacts host (ns of the MinIO service, where the TLS secret lives).
       This host is the PRIMARY artifact-read host. Every artifact read is authenticated (OIDC
       login, any user of the IdP) and authorized per artifact by artifact-gate, EXCEPT pub/,
       which is read anonymously (rule 2) when artifactsGate.anonymousPubEnabled is true:
       straight from MinIO by default, or through the gate's anonymous decision
       (gate-pub-auth) when artifactsGate.anonymousPubThroughGate is true. .acl.json and
       directory listings are NEVER served anonymously: in the first case they fall through to
       the gated rule, where the gate 404s them; in the second the gate's anonymous decision
       404s them. Writes are refused before login on the whole host.

       Middleware order on the artifact rule is [errors, gate-auth, strip, csp] — see
       gate-middlewares.yaml: errors must be outermost to turn the gate's 401 into a 302
       sign-in, and csp innermost so it only stamps MinIO responses (a sandbox CSP on the
       deny page would block its Request-access form).

       A future public hostname reuses these routes: add it to artifactsExtraHosts and its
       callback to the IdP app. */ -}}
{{- $m := .Values.minio }}
{{- $sso := .Values.namespaces.sso }}
{{- $hostMatch := include "artifacts.hostMatch" . }}
{{- /* Edge block: a request carrying the unsigned-payload trailer sha256 or a snowball extract
       header matches no MinIO-backed rule (MinIO 400s on them anyway). Rule 1 (the gate's 405)
       is not MinIO-backed and is left as it is. */ -}}
{{- $edge := "!HeaderRegexp(`X-Amz-Content-Sha256`, `(?i)STREAMING-UNSIGNED-PAYLOAD-TRAILER`) && !HeaderRegexp(`X-Amz-Meta-Snowball-Auto-Extract`, `.*`) && !HeaderRegexp(`X-Minio-Extract`, `.*`)" }}
{{- /* Hard guard: the anonymous pub/ rule below must never coexist with public exposure of
       this host. publicExposure is the chart's key for "this host is reachable from the public
       internet". Refuse to render with both set rather than rely on the operator remembering
       the comment. Public DNS alone is not a chart value, so it cannot be guarded in code —
       flip artifactsGate.anonymousPubEnabled=false by hand before pointing public DNS here. */ -}}
{{- if and .Values.artifactsGate.anonymousPubEnabled .Values.publicExposure }}
  {{- fail "artifacts-routes: artifactsGate.anonymousPubEnabled=true and publicExposure=true: the anonymous pub/ rule must never coexist with public exposure of the artifacts host. Set artifactsGate.anonymousPubEnabled=false before exposing the host publicly." }}
{{- end }}
{{- /* Where rule 2 decides an anonymous pub/ read: straight from MinIO (false, default) or the
       gate's anonymous decision first (true). Meaningless without anonymous pub/: refused. */ -}}
{{- $pubViaGate := .Values.artifactsGate.anonymousPubThroughGate | default false }}
{{- if not (kindIs "bool" $pubViaGate) }}
  {{- fail (printf "artifactsGate.anonymousPubThroughGate must be a boolean (true or false), got %v" $pubViaGate) }}
{{- end }}
{{- if and $pubViaGate (not .Values.artifactsGate.anonymousPubEnabled) }}
  {{- fail "artifacts-routes: artifactsGate.anonymousPubThroughGate=true needs artifactsGate.anonymousPubEnabled=true (it says where the anonymous pub/ read is decided)." }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artifacts-routes
  namespace: {{ $m.namespace }}
  labels:
    app.kubernetes.io/part-of: artifacts
  {{- with include "artifacts.ingressRouteAnnotations" $ }}{{ . | nindent 2 }}{{- end }}
spec:
  entryPoints: [websecure]
  tls:
    secretName: {{ $m.gateTlsSecret }}
  routes:
    # 1. Any write to the bucket on this host: straight to the gate, which answers 405 for every
    #    method other than GET/HEAD (before any login). No PUT/POST/DELETE, no multipart, no S3 Select.
    - kind: Rule
      priority: 600
      match: >-
        {{ $hostMatch }} && PathPrefix(`/{{ $m.bucket }}`) && !(Method(`GET`) || Method(`HEAD`))
      services:
        - {name: artifact-gate, namespace: {{ $sso }}, port: 8080}
    {{- /*
      ==== ANONYMOUS PUB RULE — INVARIANT ====
      The rule below serves <bucket>/pub/ WITHOUT any authentication, straight from MinIO. It is
      safe ONLY while this host is not reachable from the public internet (VPN / private network
      only). Before ANY public exposure of this host, set artifactsGate.anonymousPubEnabled=false
      so this rule is not rendered. The fail guard at the top of this file refuses to render the
      chart with this rule and publicExposure=true both on.
    */}}
    {{- if and .Values.artifactsGate.anonymousPubEnabled $pubViaGate }}
    # 2. Public read: anonymous GET/HEAD on pub/, decided by the gate first (gate-pub-auth ->
    #    /_gate/pub-auth on the gate's decision listener, no login): it allows only an existing
    #    object whose pub root has no .acl.json and signs that read (like gate-auth); a missing
    #    key, a key with an ACL, .acl.json, a listing and every traversal shape get the gate's
    #    one 404 page, never MinIO's error or a login redirect. No exclusions here: every
    #    pub/ GET/HEAD shape reaches that decision.
    #    Writes to pub/ still hit rule 1 (405 from the gate): this rule is GET/HEAD only.
    #    artifacts-csp is FIRST so the gate's own 404 carries the sandbox CSP too;
    #    artifacts-strip-to-minio runs after the decision (MinIO's 8 KB header cap).
    - kind: Rule
      priority: 550
      match: >-
        {{ $hostMatch }} && PathPrefix(`/{{ $m.bucket }}/pub/`) && (Method(`GET`) || Method(`HEAD`)) && {{ $edge }}
      middlewares:
        - {name: artifacts-csp, namespace: {{ $sso }}}
        - {name: gate-pub-auth, namespace: {{ $sso }}}
        - {name: artifacts-strip-to-minio, namespace: {{ $sso }}}
      services:
        - {name: {{ $m.service }}, port: {{ $m.port }}}
    {{- else if .Values.artifactsGate.anonymousPubEnabled }}
    # 2. Public read: anonymous GET/HEAD on pub/, straight to MinIO (its bucket policy allows
    #    anonymous GetObject on pub/*).
    #    Exclusions (this is the gate host, so the gate's guarantees must survive the shortcut):
    #      - `.acl.json` never served anonymously: it falls to the gated rule, where the gate 404s
    #        ACLs. Never write a .acl.json under pub/ — the publisher CLI enforces this.
    #      - trailing-slash paths (directory listings) fall to the gated rule, where the gate 404s
    #        listings.
    #    Writes to pub/ still hit rule 1 (405 from the gate): this rule is GET/HEAD only.
    #    artifacts-strip-to-minio: a logged-in browser sends its (large) oauth2-proxy cookies here
    #    too and MinIO 400s (MetadataTooLarge) above 8 KB of headers. artifacts-csp: pub HTML must
    #    not run same-origin on the host that carries the gate's session cookies.
    - kind: Rule
      priority: 550
      match: >-
        {{ $hostMatch }} && PathPrefix(`/{{ $m.bucket }}/pub/`) && (Method(`GET`) || Method(`HEAD`))
        && !PathRegexp(`\.acl\.json$`) && !PathRegexp(`/$`) && {{ $edge }}
      middlewares:
        - {name: artifacts-strip-to-minio, namespace: {{ $sso }}}
        - {name: artifacts-csp, namespace: {{ $sso }}}
      services:
        - {name: {{ $m.service }}, port: {{ $m.port }}}
    {{- end }}
    # 3. Artifact read: forwardAuth to the gate (login + per-artifact ACL), then MinIO GET/HEAD
    #    carrying the gate's SigV4 headers (gate-auth authResponseHeaders). strip runs after
    #    gate-auth: the gate still sees the session cookie, MinIO does not (8 KB header cap).
    #    Bucket-level paths (`/<bucket>`, `/<bucket>/?list-type=2`) and `.acl.json` never match
    #    a serving rule here: the gate answers 404 for them (no listing, ACLs are never served).
    {{- if $pubViaGate }}
    #    pub/ never lands here: rule 2 sends every pub/ GET/HEAD to the gate's anonymous decision.
    {{- else }}
    #    pub/ .acl.json and pub/ trailing-slash paths land here from rule 2's exclusions and 404.
    {{- end }}
    #    `_plugins/` and `_gate/` are never served: the gate 404s them (see gate/gate.py _bad_key).
    - kind: Rule
      priority: 500
      match: >-
        {{ $hostMatch }} && PathPrefix(`/{{ $m.bucket }}/`) && (Method(`GET`) || Method(`HEAD`)) && {{ $edge }}
      middlewares:
        - {name: artifacts-errors, namespace: {{ $sso }}}
        - {name: gate-auth, namespace: {{ $sso }}}
        - {name: artifacts-strip-to-minio, namespace: {{ $sso }}}
        - {name: artifacts-csp, namespace: {{ $sso }}}
      services:
        - {name: {{ $m.service }}, port: {{ $m.port }}}
    # 4. Gate's own endpoints (deny page posts here; approve/deny links open here). The gate does its
    #    own authentication for these (401 -> sign_in redirect is built by the gate itself).
    #    /_gate/auth, /_gate/plugin/ (the plugin authz API) and /_gate/healthz are deliberately NOT
    #    routed: only traefik (forwardAuth) and the cluster may reach them, so no one can drive a
    #    decision endpoint directly. This exclusion is defense-in-depth on top of the
    #    structural port split: the decision endpoints only listen on values.gate.authPort (8081),
    #    which no route here points at, and the gate 404s them on this 8080 listener anyway.
    {{- if $pubViaGate }}
    #    /_gate/pub-auth (the anonymous pub/ decision, gate-pub-auth's target) is not routed either.
    {{- end }}
    - kind: Rule
      priority: 400
      match: >-
        {{ $hostMatch }} && PathPrefix(`/_gate/`) && !Path(`/_gate/auth`) && !Path(`/_gate/healthz`)
        && !PathPrefix(`/_gate/plugin/`){{ if $pubViaGate }} && !Path(`/_gate/pub-auth`){{ end }}
      services:
        - {name: artifact-gate, namespace: {{ $sso }}, port: 8080}
    # 5. oauth2-proxy browser endpoints for this host: an ALLOW-LIST, nothing else under the
    #    prefix is routed. oauth2-proxy runs with --upstream=static://202 and
    #    --set-authorization-header, so EVERY path its own router does not claim (/auth, which
    #    only the gate calls in-cluster, but also /zzz, /, /ping, /userinfo, /sign_inX,
    #    /SIGN_IN...) is authenticated and answered 202 + `Authorization: Bearer <id_token>`.
    #    Routed: sign_in, start, callback, sign_out (exact, case-sensitive like oauth2-proxy's
    #    router) and static/<file> (its CSS and fonts; file names only, no dot segment, no '%',
    #    no listing). Query strings are not part of the path, so ?rd= / ?code=&state= pass.
    #    Relies on Traefik >= v3.5 routing semantics (pkg/muxer/http withRoutingPath and the
    #    entryPoint normalizePath/sanitizePath handlers): the rules match the normalized path
    #    (unreserved %XX decoded, dot segments and '//' removed, reserved %XX such as %2F %3B
    #    %25 kept encoded) and that same normalized path is what oauth2-proxy receives, so an
    #    exact match here is an exact match there. tests/check_oauth2_routes.py models this.
    - kind: Rule
      priority: 300
      match: >-
        {{ $hostMatch }} && (Path(`/oauth2-artifacts/sign_in`) || Path(`/oauth2-artifacts/start`)
        || Path(`/oauth2-artifacts/callback`) || Path(`/oauth2-artifacts/sign_out`)
        || PathRegexp(`^/oauth2-artifacts/static/([A-Za-z0-9_-]+/)*[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)+$`))
      services:
        - {name: oauth2-proxy-artifacts, namespace: {{ $sso }}, port: 4180}
