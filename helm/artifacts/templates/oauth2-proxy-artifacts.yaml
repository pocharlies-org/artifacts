{{- /* The login proxy for the artifacts host. Same image and hardening as a classic
       oauth2-proxy deployment, but by default NO --allowed-group and --email-domain=*: ANY
       user of the IdP gets a session here; who reads what is decided per artifact by
       artifact-gate (gate/gate.py) from the artifact's .acl.json. Own prefix, redirect URL and
       cookie so its callback never lands on another proxy (and vice versa).

       Values (oauth2Proxy.*):
         emailDomains     one --email-domain per entry instead of --email-domain=* (never `*`)
         trustedProxyIPs  one --trusted-proxy-ip per entry (oauth2-proxy v7.15.2 or newer)
         extraArgs        appended after the chart's flags; --email-domain, --trusted-proxy-ip
                          and --trusted-ip are refused there
         resources        container resources (add ephemeral-storage to bound local disk) */ -}}
{{- $sso := .Values.namespaces.sso }}
{{- $slug := "artifacts" }}
{{- $op := .Values.oauth2Proxy | default dict }}
{{- $domains := $op.emailDomains | default list }}
{{- $proxies := $op.trustedProxyIPs | default list }}
{{- $extra := $op.extraArgs | default list }}
{{- range $k, $v := dict "emailDomains" $domains "trustedProxyIPs" $proxies "extraArgs" $extra }}
{{- if not (kindIs "slice" $v) }}
{{- fail (printf "oauth2Proxy.%s must be a list, got %v" $k $v) }}
{{- end }}
{{- end }}
{{- range $d := $domains }}
{{- if eq (toString $d) "*" }}
{{- fail "oauth2Proxy.emailDomains: `*` is not a domain; leave the list empty to accept every account the issuer signs in" }}
{{- end }}
{{- if not (regexMatch "^(\\*?\\.)?[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$" (toString $d)) }}
{{- fail (printf "oauth2Proxy.emailDomains: %q is not a domain name" (toString $d)) }}
{{- end }}
{{- end }}
{{- range $ip := $proxies }}
{{- if not (regexMatch "^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$" (toString $ip)) }}
{{- fail (printf "oauth2Proxy.trustedProxyIPs: %q is not an IP address or CIDR range" (toString $ip)) }}
{{- end }}
{{- end }}
{{- range $a := $extra }}
{{- if not (regexMatch "^--[a-z0-9][a-z0-9-]*(=.*)?$" (toString $a)) }}
{{- fail (printf "oauth2Proxy.extraArgs: %q must be one flag, --name or --name=value, on one line" (toString $a)) }}
{{- end }}
{{- $flag := regexReplaceAll "=.*$" (toString $a) "" }}
{{- if has $flag (list "--email-domain" "--trusted-proxy-ip") }}
{{- fail (printf "oauth2Proxy.extraArgs: set %s through oauth2Proxy.%s, not extraArgs" $flag (ternary "emailDomains" "trustedProxyIPs" (eq $flag "--email-domain"))) }}
{{- end }}
{{- if eq $flag "--trusted-ip" }}
{{- fail "oauth2Proxy.extraArgs: --trusted-ip is refused: it lets matching client addresses skip authentication, and the gate takes this proxy's answer as the visitor's identity (for X-Forwarded-* trust use oauth2Proxy.trustedProxyIPs)" }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-{{ $slug }}
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: {{ $slug }}
    app.kubernetes.io/part-of: artifacts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: {{ $slug }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: {{ $slug }}
        app.kubernetes.io/part-of: artifacts
    spec:
      automountServiceAccountToken: false   # oauth2-proxy never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: {{ .Values.image }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.oidcIssuer }}
            {{- if $domains }}
            # oauth2Proxy.emailDomains: only accounts of these domains get a session (no `*`)
            {{- range $d := $domains }}
            - --email-domain={{ $d }}
            {{- end }}
            {{- else }}
            # --email-domain=* (oauth2Proxy.emailDomains empty) is NOT an open door: the real
            # boundary is the IdP the issuer URL pins (in the Entra example, a SINGLE-TENANT app, so
            # only accounts of that tenant can ever complete a login here). If the app registration
            # is ever made multi-tenant (or the issuer swapped for a common/multi-tenant endpoint),
            # list the tenant's verified domain(s) in oauth2Proxy.emailDomains BEFORE that change
            # ships.
            - --email-domain=*
            {{- end }}
            - --oidc-email-claim=preferred_username
            - --oidc-groups-claim=groups
            # no --allowed-group by default (oauth2Proxy.extraArgs can add one): IdP membership is the
            # gate's "signed in" test; the artifact ACL decides access
            - --scope=openid email profile
            - --code-challenge-method=S256
            - --proxy-prefix=/oauth2-{{ $slug }}
            - --redirect-url=https://{{ .Values.artifactsHost }}/oauth2-{{ $slug }}/callback
            # host-only cookie (no --cookie-domain); redirects (rd=) accepted only to this host
            - --whitelist-domain={{ .Values.artifactsHost }}
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_{{ $slug }}
            - --cookie-samesite=lax
            - --cookie-expire={{ .Values.cookieExpire }}
            - --cookie-csrf-expire={{ .Values.cookieCsrfExpire }}
            - --reverse-proxy=true
            {{- range $ip := $proxies }}
            - --trusted-proxy-ip={{ $ip }}
            {{- end }}
            - --set-xauthrequest=true
            # the /auth 202 also carries `Authorization: Bearer <id_token>`; the gate reads its
            # `name` claim as the DISPLAY name for plugins (identity stays X-Auth-Request-Email).
            # /oauth2-artifacts/auth is therefore not routed publicly (artifacts-routes rule 5).
            - --set-authorization-header=true
            - --pass-access-token=false
            - --skip-provider-button=true
            - --prompt={{ .Values.oidcPrompt }}
            - --http-address=0.0.0.0:4180
            - --upstream=static://202
            - --silence-ping-logging=true
            {{- range $a := $extra }}
            - {{ toString $a | quote }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: client-id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: cookie-secret}
          ports:
            - {name: http, containerPort: 4180, protocol: TCP}
          livenessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ping, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml (required "oauth2Proxy.resources is required" $op.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-{{ $slug }}
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: {{ $slug }}
    app.kubernetes.io/part-of: artifacts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: {{ $slug }}
  ports:
    - {name: http, port: 4180, targetPort: http, protocol: TCP}
