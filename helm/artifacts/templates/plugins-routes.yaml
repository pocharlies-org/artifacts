{{- /* Plugin routes (docs/plugins.md §2): one route per enabled plugin, on the artifacts
       host. The core never proxies plugin traffic itself — traefik sends matching requests
       straight to the plugin service. A plugin's pathPrefix must start with `/_` so it can
       never shadow an artifact path (`/<bucket>/...`), the gate surface (`/_gate/`) or the
       login surface (`/oauth2-artifacts/`). Host names: see artifacts.hostMatch. */ -}}
{{- $m := .Values.minio }}
{{- $hostMatch := include "artifacts.hostMatch" . }}
{{- range $p := .Values.plugins }}
{{- $name := required "each plugin needs a name" $p.name | toString }}
{{- /* DNS-1123 label: the name becomes part of the IngressRoute name, so no leading or
       trailing '-' (`canvas-` used to render an invalid object name). */ -}}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $name) }}
  {{- fail (printf "plugin name %q must match ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ (DNS-1123 label)" $name) }}
{{- end }}
{{- $prefix := required (printf "plugin %s needs a pathPrefix (e.g. /_%s/)" $name $name) $p.pathPrefix }}
{{- if not (hasPrefix "/_" $prefix) }}
  {{- fail (printf "plugin %s: pathPrefix must start with /_ (got %s) so it cannot shadow artifact, gate or login paths" $name $prefix) }}
{{- end }}
{{- if not (hasSuffix "/" $prefix) }}
  {{- fail (printf "plugin %s: pathPrefix must end with / (got %s): Traefik PathPrefix is a string prefix" $name $prefix) }}
{{- end }}
{{- /* The prefix is written verbatim into a Traefik rule: a safe charset only, so a backtick, a
       space or a dot segment can never rewrite the rule (`/_x/`) || PathPrefix(`/` would route
       the whole host to the plugin). */ -}}
{{- if not (and (kindIs "string" $prefix) (regexMatch "^/_[a-z0-9_-]+(/[a-z0-9_-]+)*/$" $prefix)) }}
  {{- fail (printf "plugin %s: pathPrefix %q may only hold lowercase letters, digits, '_' and '-' in '/'-separated segments (^/_[a-z0-9_-]+(/[a-z0-9_-]+)*/$)" $name (toString $prefix)) }}
{{- end }}
{{- /* Reserved core paths. Traefik PathPrefix is a plain string prefix, so a plugin collides
       both when its prefix sits UNDER a reserved path (/_gate/x/) and when it COVERS one
       (/_gate, /_ga, /_): either way it would shadow the core route. */ -}}
{{- range $r := list "/_gate/" "/_plugins/" "/oauth2-artifacts/" }}
{{- if or (hasPrefix $r $prefix) (hasPrefix $prefix $r) }}
  {{- fail (printf "plugin %s: pathPrefix %s collides with the reserved core path %s" $name $prefix $r) }}
{{- end }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artifacts-plugin-{{ $name }}
  namespace: {{ $m.namespace }}
  labels:
    app.kubernetes.io/part-of: artifacts
    artifacts.pocharlies.org/plugin: {{ $name }}
  {{- with include "artifacts.ingressRouteAnnotations" $ }}{{ . | nindent 2 }}{{- end }}
spec:
  entryPoints: [websecure]
  tls:
    secretName: {{ $m.gateTlsSecret }}
  routes:
    - kind: Rule
      priority: 700
      match: {{ $hostMatch }} && PathPrefix(`{{ $prefix }}`)
      services:
        - name: {{ required (printf "plugin %s needs a service" $name) $p.service }}
          namespace: {{ default $.Values.namespaces.sso $p.namespace }}
          port: {{ required (printf "plugin %s needs a port" $name) $p.port }}
{{- end }}
