{{- /* Middlewares for the artifacts host (watched by traefik).

       gate-auth        forwardAuth to artifact-gate: the gate authenticates via oauth2-proxy-artifacts
                        and decides against the artifact's .acl.json. Its 4xx (401/403/404/405) and body
                        are passed through to the browser by traefik.
                        On allow it returns SigV4 headers (Authorization, X-Amz-Date,
                        X-Amz-Content-Sha256) for that exact read, which traefik forwards to MinIO.
                        Points at the DECISION listener values.gate.authPort (8081), a port no public
                        IngressRoute references: the decision endpoint is structurally separate from
                        the public request-access surface on 8080, and the gate itself 404s the
                        decision paths on 8080, so a misrouted route cannot drive it.
       artifacts-errors turns the gate's 401 into a 302 to the proxy's sign_in.
       artifacts-csp    CSP `sandbox` on every artifact served by MinIO. It is ordered INSIDE gate-auth
                        (route middleware list [errors, gate-auth, strip, csp]) so it only touches upstream
                        responses: the gate's deny/confirmation pages keep their own stricter CSP, and
                        `sandbox` (which blocks form submission without allow-forms) cannot break the
                        "Request access" button. Next to the CSP it sends X-Content-Type-Options:
                        nosniff (the browser keeps the stored Content-Type, never sniffs a script
                        or stylesheet out of another type) and Referrer-Policy: no-referrer (links
                        and subresources of an artifact never carry its URL to another site).
       artifacts-strip  drops the (large) session cookies and X-Auth-Request-* headers before MinIO:
                        MinIO rejects requests whose headers total > 8 KB with 400 MetadataTooLarge.
       gate-pub-auth    forwardAuth to the gate's ANONYMOUS pub/ decision (/_gate/pub-auth on the same
                        decision listener): no login, allows only an existing pub/ object whose pub
                        root has no .acl.json and signs that read; one 404 page for everything else.
                        Rendered whenever artifactsGate.anonymousPubEnabled is true; attached only to
                        the pub/ rule, and only when artifactsGate.anonymousPubThroughGate is true
                        (artifacts-routes.yaml rule 2). trustForwardHeader is always false here: on a
                        path with no login, the URI the gate decides must be the one Traefik received. */ -}}
{{- $sso := .Values.namespaces.sso }}
{{- $trustFwd := .Values.gate.trustForwardHeader | default false }}
{{- if not (kindIs "bool" $trustFwd) }}
{{- fail (printf "gate.trustForwardHeader must be a boolean (true or false), got %v" $trustFwd) }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-auth
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/part-of: artifacts
spec:
  forwardAuth:
    address: http://artifact-gate.{{ $sso }}.svc.cluster.local:{{ .Values.gate.authPort }}/_gate/auth
    # gate.trustForwardHeader, default false: Traefik then drops the request's X-Forwarded-*
    # headers and sets the ones the gate reads (X-Forwarded-Method/-Uri/-Host) from the request it
    # received, so the URI the gate authorizes is the URI that is served.
    trustForwardHeader: {{ $trustFwd }}
    # On allow the gate signs the upstream MinIO read (SigV4, the dedicated read-signing user): the
    # bucket has no anonymous read policy outside pub/. Traefik copies these onto the request,
    # replacing anything the visitor sent.
    authResponseHeaders: ["Authorization", "X-Amz-Date", "X-Amz-Content-Sha256"]
{{- if .Values.artifactsGate.anonymousPubEnabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gate-pub-auth
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/part-of: artifacts
spec:
  forwardAuth:
    # the anonymous pub/ decision: no identity is asked, so no session is needed
    address: http://artifact-gate.{{ $sso }}.svc.cluster.local:{{ .Values.gate.authPort }}/_gate/pub-auth
    # always false (not gate.trustForwardHeader): Traefik sets X-Forwarded-Method/-Uri/-Host
    # from the request it received, whatever the client sent
    trustForwardHeader: false
    # on allow, the same signed upstream read as gate-auth
    authResponseHeaders: ["Authorization", "X-Amz-Date", "X-Amz-Content-Sha256"]
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: artifacts-errors
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/part-of: artifacts
spec:
  errors:
    status: ["401"]
    statusRewrites:
      "401": 302
    query: /oauth2-artifacts/sign_in?rd={url}
    service:
      name: oauth2-proxy-artifacts
      namespace: {{ $sso }}
      port: 4180
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: artifacts-csp
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/part-of: artifacts
spec:
  headers:
    customResponseHeaders:
      # No HTML/JS of an artifact may run in the origin of the host or reach its cookies.
      # `sandbox` alone (no allow-same-origin) blocks same-origin fetch, cookies and storage;
      # allow-scripts is set because artifacts here are self-contained reports with inline JS.
      # allow-forms is NOT set, so the gate deny page keeps its own CSP and its form works.
      Content-Security-Policy: sandbox allow-scripts
      X-Content-Type-Options: nosniff
      Referrer-Policy: no-referrer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: artifacts-strip-to-minio
  namespace: {{ $sso }}
  labels:
    app.kubernetes.io/part-of: artifacts
spec:
  headers:
    customRequestHeaders:
      Cookie: ""
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Preferred-Username: ""
      X-Auth-Request-Groups: ""
