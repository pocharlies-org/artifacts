# artifacts Helm chart — EXAMPLE values. Replace every placeholder with your own.
# Nothing in this file points at a real deployment.

# ---- login (oauth2-proxy) --------------------------------------------------------------
# Digest-pinned image; any OIDC provider works (the example issuer below is Entra).
image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
# OIDC issuer. Example: a single-tenant Entra app with a placeholder tenant id.
oidcIssuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
# Keys client-id, client-secret, cookie-secret. Create out of band; never in git.
secretName: oauth2-proxy-artifacts
cookieExpire: 8h
cookieCsrfExpire: 1h        # login -> callback window (CSRF cookie)
oidcPrompt: select_account  # show the account picker; avoids silent 403 on shared browsers

oauth2Proxy:
  # Who may sign in at all (oauth2-proxy --email-domain). Empty (default): the chart renders
  # --email-domain=*, so every account the issuer accepts gets a session and the artifact ACLs
  # decide what it reads. List your organisation's verified domains to refuse every other
  # account at login, e.g. [example.com, example.org]: one --email-domain per entry and never
  # `*` (oauth2-proxy also reads `.example.com` and `*.example.com` as "any subdomain"). An
  # entry `*` is refused (leave the list empty for that).
  emailDomains: []
  # Reverse proxies allowed to set X-Forwarded-* and the client-IP header (one
  # --trusted-proxy-ip per IP or CIDR, e.g. your ingress controller's pod CIDR). The flag
  # exists from oauth2-proxy v7.15.2 (v7.15.5 or newer recommended; the example image above
  # is v7.15.6), so keep `image` at such a release. Empty (default): no flag, and
  # oauth2-proxy keeps its own default (it trusts every source).
  trustedProxyIPs: []
  # Extra oauth2-proxy flags, appended after the chart's own. Only --allowed-group=<group id>
  # (non-empty id; one entry per group) is accepted: any other flag is refused, because a flag
  # appended last can override the chart's own, so a different login-proxy flag is a chart
  # change. --email-domain and --trusted-proxy-ip have the two lists above.
  extraArgs: []
  # Container resources. To bound local disk, add ephemeral-storage to both, e.g.
  #   requests: {ephemeral-storage: 16Mi}   limits: {ephemeral-storage: 64Mi}
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}

# ---- the artifacts host ---------------------------------------------------------------
# Lowercase DNS names only (letters, digits, inner '-', labels joined by '.'; no port, no
# wildcard): they are written into Traefik rules, so the chart refuses anything else.
artifactsHost: artifacts.example.com
# Extra hostnames served with the same routes (e.g. a future public name).
artifactsExtraHosts: []

# Set true when this host becomes reachable from the public internet. The chart REFUSES
# to render with publicExposure=true and artifactsGate.anonymousPubEnabled=true at the
# same time: anonymous pub/ is only safe on a host that is not publicly reachable.
publicExposure: false

# Annotations put on every IngressRoute the chart renders (the artifacts host routes and
# every plugin route), e.g. the class your Traefik watches:
#   ingressRouteAnnotations:
#     kubernetes.io/ingress.class: traefik-internal
ingressRouteAnnotations: {}

# Namespaces the chart deploys into: the gate, the login proxy and the middlewares go to
# namespaces.sso; the routes and the bootstrap Job go to minio.namespace (with the MinIO
# service, because that is where the IngressRoute TLS secrets are). Set both to the same
# value to run everything in one namespace. namespaces.minio is not read by any template.
namespaces:
  sso: sso
  minio: minio

# ---- MinIO ----------------------------------------------------------------------------
minio:
  namespace: minio
  service: minio
  port: 9000
  # S3 bucket name, written into Traefik rules: 3-63 of lowercase letters, digits, '.' and
  # '-', starting and ending with a letter or digit (the chart refuses anything else)
  bucket: artifacts
  tlsSecret: artifacts-minio-tls       # cert for the MinIO service (used by the old host pattern; optional)
  gateTlsSecret: artifacts-gate-tls    # cert served on the artifacts host routes

# ---- artifact-gate --------------------------------------------------------------------
artifactsGate:
  # Serve <bucket>/pub/ anonymously (no login). Safe ONLY while the host is not publicly
  # reachable. Keep false for any public host. See README.
  anonymousPubEnabled: false
  # Where the anonymous pub/ read is decided (only with anonymousPubEnabled: true; the chart
  # refuses true without it).
  #   false (default): rule 2 serves pub/ straight from MinIO (its anonymous pub/* policy);
  #     .acl.json and listings are kept off it by the rule. A missing key answers with
  #     MinIO's own error.
  #   true: rule 2 asks the gate first (forwardAuth middleware gate-pub-auth, the gate's
  #     /_gate/pub-auth on gate.authPort): the gate allows only an existing object whose pub
  #     root has no .acl.json, signs that read, and answers everything else (missing key,
  #     ACL'd key, listing, .acl.json, traversal shapes) with one 404 page of its own.
  # The gate-pub-auth middleware itself is rendered whenever anonymousPubEnabled is true, so
  # turning this on changes routes only.
  anonymousPubThroughGate: false

gate:
  # How the gate code reaches the pod. Both modes run the same file as /app/gate.py.
  #   bakedImage: false (default) — the stock Python image below (gate.image) with the code
  #     mounted from ConfigMap <sso>/artifact-gate-code, which you recreate from gate/gate.py
  #     on every deploy, e.g.:
  #       kubectl -n sso create configmap artifact-gate-code --from-file=gate/gate.py \
  #         --dry-run=client -o yaml | kubectl apply -f -
  #   bakedImage: true — the gate image built from gate/Dockerfile (published by
  #     .github/workflows/publish.yml, see README "Gate image") with the code inside: no
  #     ConfigMap, no code volume, no mount. The image is referenced by digest only, as
  #     <bakedImageRepository>@<bakedImageDigest>; a tag is never used. Point
  #     bakedImageRepository at your own mirror if you copy the image.
  bakedImage: false
  bakedImageRepository: ghcr.io/pocharlies-org/artifacts-gate
  bakedImageDigest: ""   # sha256:<64 hex>; required when bakedImage is true
  # Base image of the ConfigMap mode (ignored when bakedImage is true).
  image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
  # forwardAuth decision listener: the gate serves /_gate/auth and /_gate/plugin/authz
  # ONLY on this port, which no public route points at. The public surface stays on 8080.
  authPort: 8081
  # trustForwardHeader of the gate-auth forwardAuth middleware (always rendered explicitly).
  # false (default): Traefik drops every X-Forwarded-* header of the request and sets
  # X-Forwarded-For/-Method/-Proto/-Port/-Host/-Uri for the gate from the request it received,
  # so the URI the gate authorizes is the URI that is served, whatever the client sent.
  # true forwards the X-Forwarded-* headers the request carries, i.e. whatever the
  # entrypoint's forwardedHeaders settings let through from the client.
  trustForwardHeader: false
  # Request-access caps: they bound the messages a requester can cause, never who can read
  # what. Whole numbers from 1 to 999999 (the chart and the gate refuse anything else).
  # Requests per requester and file stay at the gate's default, 5 per day.
  requestCaps:
    # access requests one signed-in user may send per day, across every artifact
    # (GATE_REQUESTER_RATE_LIMIT_MAX)
    perRequester: 20
    # open requests an owner is sent at a time; above it a request is recorded and logged
    # but no message is sent, until the owner decides one or its links expire
    # (GATE_OWNER_PENDING_MAX)
    ownerPending: 10
  # Container resources. To bound local disk, add ephemeral-storage to both, e.g.
  #   requests: {ephemeral-storage: 16Mi}   limits: {ephemeral-storage: 64Mi}
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  s3SecretName: artifact-gate-s3        # keys access-key, secret-key (least-privilege gate user:
                                        # ACL + _gate/ state work)
  # Dedicated read-signing user, keys access-key/secret-key. Signs ONLY the forwarded artifact
  # reads; its policy (bootstrap Job) is s3:GetObject on the bucket with an explicit Deny on
  # _gate/*, _plugins/* and every .acl.json. Must be a different user from s3SecretName's.
  readS3SecretName: artifact-gate-read-s3
  keysSecretName: artifact-gate-keys    # key hmac-key (signs CSRF + approve/deny tokens)
  slackSecretName: artifact-gate-slack  # key bot-token (optional; gate logs instead if absent)

# ---- plugins (docs/plugins.md) ----------------------------------------------------------
# Each entry renders one route on the artifacts host and gets the bucket prefix
# _plugins/<name>/ with its own least-privilege S3 user (created by the bootstrap Job
# from the Secret plugin-<name>-s3, keys access-key/secret-key).
# Example:
#   plugins:
#     - name: canvas              # ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ (DNS-1123 label)
#       pathPrefix: /_canvas/     # ^/_[a-z0-9_-]+(/[a-z0-9_-]+)*/$ (starts with /_, ends with /)
#       service: artifact-canvas
#       port: 8080
#       namespace: sso            # optional; defaults to namespaces.sso
plugins: []

# ---- bootstrap Job (bucket, ILM, policies, users) ---------------------------------------
bootstrap:
  enabled: true
  # Frozen legacy mirror: the original minio/mc RELEASE tags were removed from
  # Docker Hub (404). This image bundles the mc client at
  # /opt/bitnami/minio-client/bin/mc (the Job exports that PATH).
  image: bitnamilegacy/minio@sha256:d7cd0e172c4cc0870f4bdc3142018e2a37be9acf04d68f386600daad427e0cab
  # MinIO admin credentials the Job uses (keys access-key/secret-key, in minio.namespace).
  adminSecretName: minio-bootstrap-admin
  # Container resources (ephemeral-storage can be added as for the gate).
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
