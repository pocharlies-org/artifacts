name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests (gate + mcp lib)
        run: python3 -I -m unittest discover -s tests -p 'test_*.py' -v
      - name: e2e tests (fake MinIO + fake oauth2-proxy)
        run: python3 -I -m unittest discover -s tests -p 'e2e_*.py' -v
      - name: shell syntax
        run: bash -n cli/publish.sh deploy/compose/e2e.sh deploy/compose/bootstrap.sh
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint
        run: helm lint helm/artifacts
      - name: helm template (example values, no plugins)
        run: helm template t helm/artifacts -f helm/artifacts/values.yaml >/dev/null
      - name: helm template (with one plugin)
        run: |
          helm template t helm/artifacts -f helm/artifacts/values.yaml \
            --set 'plugins[0].name=canvas' \
            --set 'plugins[0].pathPrefix=/_canvas/' \
            --set 'plugins[0].service=artifact-canvas' \
            --set 'plugins[0].port=8080' \
            | grep -q '/_canvas/'
      - name: helm template refuses anonymous pub on a public host
        run: |
          helm template t helm/artifacts -f helm/artifacts/values.yaml \
              --set artifactsGate.anonymousPubEnabled=true --set publicExposure=true 2>&1 \
            | grep -q 'anonymousPubEnabled'
      - name: helm template refuses reserved or malformed plugin prefixes and names
        run: |
          for spec in canvas:/_gate/x/ canvas:/_plugins/x/ canvas:/oauth2-artifacts/x \
                      canvas:/_gate canvas:/_ canvas:/_canvas Canvas_1:/_c/ \
                      canvas-:/_canvas-/ -canvas:/_canvas/ -:/_x/ can--:/_c/; do
            if helm template t helm/artifacts -f helm/artifacts/values.yaml \
                --set-string "plugins[0].name=${spec%%:*}" --set "plugins[0].pathPrefix=${spec#*:}" \
                --set plugins[0].service=s --set plugins[0].port=8080 >/dev/null 2>&1; then
              echo "rendered but must fail: $spec"; exit 1
            fi
          done
      - name: helm template quotes a numeric plugin name
        run: |
          helm template t helm/artifacts -f helm/artifacts/values.yaml \
              --set-string 'plugins[0].name=123' --set 'plugins[0].pathPrefix=/_c123/' \
              --set plugins[0].service=s --set plugins[0].port=8080 \
            | grep -q 'name: PLUGIN_NAMES, value: "123"'
      - name: helm template accepts an inner '-' in a plugin name (DNS-1123 label)
        run: |
          helm template t helm/artifacts -f helm/artifacts/values.yaml \
              --set-string 'plugins[0].name=can-vas' --set 'plugins[0].pathPrefix=/_can-vas/' \
              --set plugins[0].service=s --set plugins[0].port=8080 \
            | grep -q 'name: artifacts-plugin-can-vas'
      - name: helm template routes only oauth2-proxy's browser endpoints (allow-list)
        run: |
          helm template t helm/artifacts -f helm/artifacts/values.yaml | python3 -I tests/check_oauth2_routes.py
          helm template t helm/artifacts -f helm/artifacts/values.yaml \
              --set artifactsGate.anonymousPubEnabled=true --set 'artifactsExtraHosts[0]=b.example.com' \
              --set 'plugins[0].name=canvas' --set 'plugins[0].pathPrefix=/_canvas/' \
              --set 'plugins[0].service=artifact-canvas' --set 'plugins[0].port=8080' \
            | python3 -I tests/check_oauth2_routes.py
      - name: compose Caddyfile routes only oauth2-proxy's browser endpoints (allow-list)
        run: |
          grep -qF 'vars_regexp {http.request.orig_uri} `^/oauth2/(sign_in|start|callback|sign_out|static/' deploy/compose/Caddyfile
          grep -qF '@oauth2other path_regexp (?i)^/+oauth2' deploy/compose/Caddyfile
          if grep -qE '^[[:space:]]*handle /oauth2' deploy/compose/Caddyfile; then
            echo "Caddyfile routes an /oauth2 prefix wholesale"; exit 1
          fi
      - name: oauth2 probe script parses
        run: python3 -I -m py_compile tests/oauth2_probe.py tests/check_oauth2_routes.py
      - name: helm template wires the read-signing user (gate env + bootstrap Job)
        run: |
          out=$(helm template t helm/artifacts -f helm/artifacts/values.yaml)
          echo "$out" | grep -q 'name: GATE_READ_ACCESS_KEY'
          echo "$out" | grep -q 'secretName: artifact-gate-read-s3'
          echo "$out" | grep -q 'ensure_user artifact-gate-read /secrets/gate-read artifact-gate-read'
          if helm template t helm/artifacts -f helm/artifacts/values.yaml --set gate.readS3SecretName= >/dev/null 2>&1; then
            echo "rendered without a read-signing user"; exit 1
          fi
